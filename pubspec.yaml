name: bitenear
description: "BiteNear — discover dishes, not just restaurants. Search any food or drink and find every nearby place serving it."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # UI & utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
